<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Conceptual Graphly Manifold Mark -->
  <defs>
    <linearGradient id="curveGrad" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Outer Precision Boundary (Isometric Cube / Hexagon outline) -->
  <polygon points="32,6 56,20 56,46 32,58 8,46 8,20" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Subtle coordinate plane facet fill -->
  <polygon points="32,32 56,20 56,46 32,58" fill="url(#planeGrad)" />
  
  <!-- 3D Coordinate Axis Spokes from Center Origin -->
  <line x1="32" y1="32" x2="32" y2="6" stroke="#18181B" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="32" x2="56" y2="46" stroke="#18181B" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="32" x2="8" y2="46" stroke="#18181B" stroke-width="2" stroke-linecap="round" />
  
  <!-- Grid tick marks on axis -->
  <line x1="30" y1="19" x2="34" y2="19" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
  <line x1="19" y1="39" x2="21" y2="43" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
  <line x1="43" y1="43" x2="45" y2="39" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />

  <!-- Parametric Wave Curve Slicing Space -->
  <path d="M 12,42 C 20,24 24,40 32,32 C 40,24 44,40 52,22" 
        stroke="url(#curveGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Precision Origin and Sample Points -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" stroke="#18181B" stroke-width="2" />
  <circle cx="21" cy="30" r="2.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
  <circle cx="43" cy="34" r="2.5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" />
  <circle cx="52" cy="22" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
